<script>
/* Simulation « potentiel normal d'un couple redox » – logique de la simulation */
(function(){
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('svg');
const world = document.getElementById('world');
document.getElementById('gdefs').innerHTML = SC.gdefs;
const $stage = document.getElementById('stage');

/* ------------------------------------------------------------------ état global */
const S = { etat_G:0, etat_D:0, etat_pont:0, etat_ficheR:0, etat_ficheB:0, branchement:0,
            pile:0, couple:0, m:0, volts:0, calibre:0, signe:'', valeur:'', message_br:'', msg_err:'' };
const vars = { valeur:'', message_br:'', msg_err_voltmeter:'' };
const varTexts = {};   // nom de variable -> [Inst texte]
let init = {};         // positions initiales (G_x, pont_x...)
let pendingFrame = null;

/* ------------------------------------------------------------------ filtres de couleur */
const fcache = {};
function colorFilter(c){
  const k = c.map(v=>v.toFixed(3)).join(',');
  if (fcache[k]) return fcache[k];
  const id = 'cf' + Object.keys(fcache).length;
  const f = document.createElementNS(NS,'filter');
  f.setAttribute('id', id); f.setAttribute('color-interpolation-filters','sRGB');
  f.setAttribute('x','-5%'); f.setAttribute('y','-5%'); f.setAttribute('width','110%'); f.setAttribute('height','110%');
  const m = document.createElementNS(NS,'feColorMatrix'); m.setAttribute('type','matrix');
  m.setAttribute('values', [c[0],0,0,0,c[4], 0,c[1],0,0,c[5], 0,0,c[2],0,c[6], 0,0,0,c[3],c[7]].join(' '));
  f.appendChild(m); document.getElementById('gdefs').appendChild(f);
  return fcache[k] = 'url(#'+id+')';
}

/* ------------------------------------------------------------------ instances */
const NOSTOP = { 254:1, 273:1, 342:1, 351:1 };   // clips qui font stop() à l'image 1
const players = new Set();
let uid = 0;

class Inst {
  constructor(id, spec, parent){
    this.id = id; this.def = SC.defs[id] || null; this.parent = parent;
    this.name = spec.n || null; this.key = spec.key; this.uid = ++uid;
    this.m = (spec.m || [1,0,0,1,0,0]).slice(); this.specM = this.m.slice();
    this.c = spec.c || 0; this.specC = this.c;
    this.rot = 0; this.vis = true;
    this.g = document.createElementNS(NS,'g');
    this.kids = new Map(); this.frame = 0; this.playing = false; this.once = false;
    this.h = {};        // gestionnaires d'événements (press, release, over, out)
    this.build();
    this.apply();
    if (this.parent) hookCreate(this);
  }
  get x(){ return this.m[4]; } set x(v){ if (isFinite(v)) { this.m[4] = v; this.apply(); } }
  get y(){ return this.m[5]; } set y(v){ if (isFinite(v)) { this.m[5] = v; this.apply(); } }
  set visible(v){ this.vis = !!v; this.apply(); }
  set rotation(r){ this.rot = r; this.apply(); }
  apply(){
    const m = this.m;
    this.g.setAttribute('transform', 'matrix(' + m.join(',') + ')' + (this.rot ? ' rotate(' + this.rot + ')' : ''));
    this.g.style.display = this.vis ? '' : 'none';
    if (this.c) { const a = this.c; this.g.setAttribute('filter', colorFilter(a)); } else this.g.removeAttribute('filter');
  }
  build(){
    const d = this.def; if (!d) return;
    if (d.t === 's') { this.g.innerHTML = d.svg; }
    else if (d.t === 'e') { buildEdit(this, d); }
    else if (d.t === 'b') { buildButton(this, d); }
    else if (d.t === 'm') {
      if (d.f.length > 1 && !NOSTOP[this.id] && this.id !== 2) this.playing = true;
      if (this.playing) players.add(this);
      this.setFrame(1);
    }
  }
  /* --- timeline */
  replay(n){
    const L = new Map(), fr = this.def.f;
    for (let f = 0; f < n; f++) fr[f].forEach((o, i) => {
      if (o.rm) L.delete(o.d);
      else if (o.id !== undefined) L.set(o.d, { id:o.id, m:o.m, n:o.n, c:o.c, key:f + '_' + i });
      else { const s = L.get(o.d); if (s) { if (o.m) s.m = o.m; if ('c' in o) s.c = o.c; if (o.n) s.n = o.n; } }
    });
    return L;
  }
  setFrame(n){
    const d = this.def; if (!d || d.t !== 'm') return;
    n = Math.max(1, Math.min(d.f.length, n));
    const T = this.replay(n);
    for (const [dep, k] of [...this.kids]) {
      const s = T.get(dep);
      if (!s || s.key !== k.key || s.id !== k.id) { k.destroy(); this.kids.delete(dep); }
    }
    for (const [dep, s] of T) {
      let k = this.kids.get(dep);
      if (!k) { k = new Inst(s.id, s, this); this.kids.set(dep, k); }
      else {
        const sm = s.m || [1,0,0,1,0,0];
        if (sm.some((v, i) => v !== k.specM[i])) { k.m = sm.slice(); k.specM = sm.slice(); k.apply(); }
        const sc = s.c || 0;
        if (JSON.stringify(sc) !== JSON.stringify(k.specC)) { k.c = sc; k.specC = sc; k.apply(); }
      }
    }
    [...this.kids.keys()].sort((a, b) => a - b).forEach(dep => this.g.appendChild(this.kids.get(dep).g));
    this.frame = n;
  }
  goto(n){ this.setFrame(n); }
  stop(){ this.playing = false; players.delete(this); }
  play(){ this.playing = true; players.add(this); }
  destroy(){
    players.delete(this);
    for (const k of this.kids.values()) k.destroy();
    for (const k in varTexts) varTexts[k] = varTexts[k].filter(t => t !== this);
    this.g.remove();
  }
  kid(name){ for (const k of this.kids.values()) if (k.name === name) return k; return null; }
}

/* ------------------------------------------------------------------ boutons */
function placeList(parent, list){
  list.forEach(o => {
    const k = new Inst(o.id, { m:o.m, c:o.c, key:'b' }, null);
    k.parent = parent; parent.appendChild(k.g);
  });
}
function buildButton(inst, d){
  const mk = (cls, list) => { const g = document.createElementNS(NS,'g'); if (cls) g.setAttribute('class', cls); placeList(g, list); return g; };
  const up = mk('nop', d.up), over = mk('nop', d.over.length ? d.over : d.up), down = mk('nop', d.down.length ? d.down : (d.over.length ? d.over : d.up));
  const hit = mk('hit', d.hit.length ? d.hit : d.up);
  over.style.display = 'none'; down.style.display = 'none';
  inst.g.append(up, over, down, hit);
  inst.g.classList.add('btn');
  let isOver = false, isDown = false;
  const show = () => {
    up.style.display = (!isOver && !isDown) ? '' : 'none';
    over.style.display = (isOver && !isDown) ? '' : 'none';
    down.style.display = isDown ? '' : 'none';
  };
  hit.addEventListener('pointerenter', () => { isOver = true; show(); run(inst.h.over); });
  hit.addEventListener('pointerleave', () => { isOver = false; if (!isDown) show(); run(inst.h.out); });
  hit.addEventListener('pointerdown', e => {
    isDown = true; show();
    const up_ = () => { isDown = false; show(); window.removeEventListener('pointerup', up_); run(inst.h.release); };
    window.addEventListener('pointerup', up_);
    run(inst.h.press, e);
  });
}

/* ------------------------------------------------------------------ textes dynamiques */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function runsHTML(runs, d){
  let h = '';
  (runs || []).forEach(r => {
    if (r.br) { h += '<br>'; return; }
    let t = esc(r.t);
    if (r.face === 'Symbol') t = t.replace(/W/g, 'Ω');
    const st = [];
    if (r.color) st.push('color:' + r.color);
    if (r.size) st.push('font-size:' + r.size + 'px');
    if (r.face && r.face !== 'Symbol') st.push('font-family:' + r.face + ',Arial,sans-serif');
    if (r.b) st.push('font-weight:bold');
    if (r.sub) st.push('vertical-align:sub;font-size:0.7em');
    if (r.sup) st.push('vertical-align:super;font-size:0.7em');
    h += '<span style="' + st.join(';') + '">' + t + '</span>';
  });
  return h;
}
function buildEdit(inst, d){
  if (d.fid) {            // chiffres LCD avec la police intégrée
    inst.lcd = true; inst.g.classList.add('nop');
    inst.path = document.createElementNS(NS,'g'); inst.g.appendChild(inst.path);
  } else {
    const fo = document.createElementNS(NS,'foreignObject');
    fo.setAttribute('x', d.x); fo.setAttribute('y', d.y); fo.setAttribute('width', d.w); fo.setAttribute('height', Math.max(d.h, 6));
    fo.style.overflow = 'visible';
    const div = document.createElement('div');
    div.style.cssText = 'font-family:Arial,Verdana,sans-serif;font-size:' + d.size + 'px;color:' + d.color + ';text-align:' + ['left','right','center','justify'][d.align] + ';' + (d.ml ? 'white-space:normal;' : 'white-space:nowrap;');
    if (!d.var) div.innerHTML = runsHTML(d.runs, d);
    fo.appendChild(div); inst.g.appendChild(fo); inst.div = div;
    inst.g.classList.add('nop');
  }
  if (d.var) { (varTexts[d.var] = varTexts[d.var] || []).push(inst); refreshText(inst, vars[d.var] || ''); }
}
function refreshText(inst, val){
  const d = inst.def;
  if (inst.lcd) {
    const f = SC.fonts[d.fid], sc = d.size / f.em * 20 /* twips->px */ / 20;
    const s = String(val); let tw = 0; const items = [];
    for (const ch of s) {
      const gi = f.code.indexOf(ch.charCodeAt(0)); if (gi < 0) continue;
      items.push([gi, tw]); tw += f.adv[gi];
    }
    const K = d.size / 20480 * 20;           // taille en px par unité de police
    const total = tw * K / 20 * 20;
    let x = d.x + 2 + (d.align === 2 ? (d.w - 4 - tw * d.size / 20480) / 2 : d.align === 1 ? d.w - 4 - tw * d.size / 20480 : 0);
    const base = d.y + 2 + f.asc * d.size / 20480;
    inst.path.innerHTML = items.map(([gi, o]) => f.g[gi] ? '<path transform="translate(' + (x + o * d.size / 20480).toFixed(2) + ' ' + base.toFixed(2) + ') scale(' + (d.size / 20480).toFixed(6) + ')" d="' + f.g[gi] + '" fill="' + d.color + '"/>' : '').join('');
  } else if (inst.div) {
    inst.div.innerHTML = esc(String(val)).replace(/\r|\n/g, '<br>');
  }
}
function setVar(name, v){ vars[name] = v; (varTexts[name] || []).forEach(t => refreshText(t, v)); }

/* ------------------------------------------------------------------ racine */
const root = new Inst(0, {}, null);
root.def = { t:'m', f:SC.root };
root.parent = null;
world.appendChild(root.g);
root.setFrame(1);
const R = n => root.kid(n);
function px(e){ const p = stage.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(stage.getScreenCTM().inverse()); return { x:q.x, y:q.y }; }

/* ------------------------------------------------------------------ son */
const audio = new Audio(SC.sound); audio.loop = true;
function sonPlay(){ try { audio.currentTime = 0; audio.play(); } catch(e){} }
function sonStop(){ try { audio.pause(); audio.currentTime = 0; } catch(e){} }

/* ------------------------------------------------------------------ logique du voltmètre */
function show(inst, v){ if (inst) inst.visible = v; }
function verif_branchement(){
  S.message_br = ''; S.msg_err = '';
  let ret;
  if (S.calibre !== 0) {

      sonPlay(); ['bul1','bul2','bul3'].forEach(n => show(R(n), true)); show(R('rob2'), true); show(R('rob1'), false);

      S.etat_G = 1; S.branchement = calcBranch(); verif_branchement();
    };
    if (id === 276) inst.h.press = () => {          // fermer le robinet
      sonStop(); ['bul1','bul2','bul3','rob2'].forEach(n => show(R(n), false)); show(R('rob1'), true);
      if (R('mano')) R('mano').goto(1);
      S.etat_G = 0; S.branchement = calcBranch(); verif_branchement(); S.branchement = 0;
    };
  }
  const hov = { 261:'infptpt', 329:'infH2', 330:'infPt', 336:'hcl' };
  if (hov[id]) { inst.h.over = () => show(R(hov[id]), true); inst.h.out = () => show(R(hov[id]), false); }
  // ---- bouton rotatif du voltmètre
  if (id === 216) {
    inst.g.style.cursor = 'pointer';
    inst.h.press = () => { rotorPress = true; };
    inst.h.release = () => { rotorPress = false; };
  }
}
let rotorPress = false;
window.addEventListener('pointerup', () => { rotorPress = false; });

function setupFicheB(inst){
  inst.g.classList.add('drag');
  inst.g.addEventListener('pointerdown', e => run(() => {
    S.etat_ficheB = 0; S.branchement = 0; const b = inst.kid('banane'); if (b) b.visible = true;
    beginDrag(inst, false, e, () => {
      const G = R('G'), D = R('D'), X = inst.x, Y = inst.y, T = tolE(10);
      const dX = D ? D.x + 8 : NaN, dY = D ? D.y - 100 : NaN, gX = G.x + 7, gY = G.y - 5;
      const bn = inst.kid('banane');
      if (S.etat_ficheR !== 1 && dX - T <= X && X <= dX + T && dY - 30 - T <= Y && Y <= dY + 10 + T - 10) {
        inst.x = dX; inst.y = dY; S.etat_ficheB = 1; S.branchement = calcBranch(); if (bn) bn.visible = false; verif_branchement();
      } else if (S.etat_ficheR !== 2 && gX - T <= X && X <= gX + T && gY - 30 - T <= Y && Y <= gY + 10 + T - 10) {
        inst.x = gX; inst.y = gY; S.etat_ficheB = 2; S.branchement = calcBranch(); if (bn) bn.visible = false; verif_branchement();
      } else { S.etat_ficheB = 0; verif_branchement(); }
    });
  }));
}
function setupFicheR(inst){
  inst.g.classList.add('drag');
  inst.g.addEventListener('pointerdown', e => run(() => {
    S.etat_ficheR = 0; S.branchement = 0; const b = inst.kid('banane'); if (b) b.visible = true;
    beginDrag(inst, false, e, () => {
      const G = R('G'), D = R('D'), X = inst.x, Y = inst.y, T = tolE(10);
      const dX = D ? D.x - 3 : NaN, dY = D ? D.y - 100 : NaN, gX = G.x - 3, gY = G.y;
      const bn = inst.kid('banane');
      if (S.etat_ficheB !== 1 && dX - T <= X && X <= dX + T && dY - 30 - T <= Y && Y <= dY + 20 + T - 10) {
        inst.x = dX; inst.y = dY; S.etat_ficheR = 1; S.branchement = calcBranch(); verif_branchement(); if (bn) bn.visible = false;
      } else if (S.etat_ficheB !== 2 && gX - T <= X && X <= gX + T && gY - 30 - T <= Y && Y <= gY + 20 + T - 10) {
        inst.x = gX; inst.y = gY; S.etat_ficheR = 2; S.branchement = calcBranch(); if (bn) bn.visible = false; verif_branchement();
      } else { S.etat_ficheR = 0; verif_branchement(); }
    });
  }));
}

/* ------------------------------------------------------------------ boucle d'animation */
function inv(m){ const [a,b,c,d,e,f] = m, det = a*d - b*c; return [d/det, -b/det, -c/det, a/det, (c*f - d*e)/det, (b*e - a*f)/det]; }
let lastMouse = { x:0, y:0 };
window.addEventListener('pointermove', e => { lastMouse = px(e); });
window.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#stage')) lastMouse = px(e); }, true);

function padHits(){
  ['rob1','rob2'].forEach(n => {
    const i = R(n); if (!i || i.padDone || !i.vis || !i.g.isConnected) return;
    const hit = i.g.querySelector('.hit'); if (!hit) return;
    const bb = hit.getBBox(); if (!bb.width) return;
    const px_ = 9 / Math.abs(i.m[0] || 1), py_ = 9 / Math.abs(i.m[3] || 1);
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', bb.x - px_); r.setAttribute('y', bb.y - py_);
    r.setAttribute('width', bb.width + 2 * px_); r.setAttribute('height', bb.height + 2 * py_);
    r.setAttribute('fill', 'transparent'); hit.appendChild(r); i.padDone = true;
  });
}
function frameLoop(){
  padHits();
  const fb = R('ficheB'), fr = R('ficheR'), G = R('G'), D = R('D');
  if (fr) { if (S.etat_ficheR === 1 && D) { fr.x = D.x - 3; fr.y = D.y - 100; } else if (S.etat_ficheR === 2) { fr.x = G.x - 10; fr.y = G.y - 32; } }
  if (fb) { if (S.etat_ficheB === 1 && D) { fb.x = D.x + 8; fb.y = D.y - 100; } else if (S.etat_ficheB === 2) { fb.x = G.x + 2; fb.y = G.y - 32; } }
  const r2 = R('ficheR2'), a2 = R('ancre2'), b2 = R('ficheB2'), an = R('ancre');
  if (r2 && fr) document.getElementById('wireR').setAttribute('d', 'M' + r2.x + ' ' + r2.y + ' Q' + a2.x + ' ' + a2.y + ' ' + fr.x + ' ' + fr.y);
  if (b2 && fb) document.getElementById('wireB').setAttribute('d', 'M' + b2.x + ' ' + b2.y + ' Q' + an.x + ' ' + an.y + ' ' + fb.x + ' ' + fb.y);
  // bouton rotatif
  if (rotorPress) {
    const vm = R('voltmeter'); const l = inv(vm.m);
    const xm = l[0]*lastMouse.x + l[2]*lastMouse.y + l[4], ym = l[1]*lastMouse.x + l[3]*lastMouse.y + l[5];
    const rota = Math.atan2(xm, -ym) / 0.017453292519943295;
    S.calibre = Math.round(rota / 22.5) || 0;
    vm.kid('rotor').rotation = 22.5 * Math.round(rota / 22.5);
    if (S.calibre !== 0) {
      if (verif_branchement()) { S.msg_err = ''; setValeur(); } else S.valeur = '000';
      syncTexts();
    } else { S.valeur = ''; S.msg_err = ''; verif_branchement(); }
  }
  requestAnimationFrame(frameLoop);
}
setInterval(() => {
  players.forEach(p => {
    const n = p.def.f.length, nx = p.frame % n + 1;
    p.setFrame(nx);
    if (p.once && nx === 1) { p.once = false; p.stop(); }
  });
}, 1000 / 12);

/* ------------------------------------------------------------------ adaptation à la largeur du cadre */
const W = 900, H = 600;
function fit(){ const w = document.getElementById('view'), k = w.clientWidth / W;   // la largeur vient du CSS
  $stage.style.transform = 'scale(' + k + ')'; w.style.height = H * k + 'px'; }
addEventListener('resize', fit); window.ResizeObserver && new ResizeObserver(fit).observe(document.getElementById('view')); fit();

frame1Actions(); syncTexts();
requestAnimationFrame(frameLoop);
window.__sim = { root, S, R, choisir, flush, showNotes };
})();
