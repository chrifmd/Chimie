<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les réactions acide-base</title>
<style>
:root{--bg:#f3f7f9;--surface:#fff;--ink:#0f2a3d;--muted:#5a7283;--line:#d3e0e8;--accent:#0b7f8c;--accent-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1a24;--surface:#13283a;--ink:#e6f0f5;--muted:#92abbb;--line:#27435a;--accent:#4fc3d1;--accent-ink:#062129;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
header{padding:18px clamp(16px,4vw,40px);background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700;letter-spacing:-.01em}
.menu{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:system-ui,Arial,sans-serif}
label{color:var(--muted);font-size:.9rem}
select{font:inherit;font-size:1rem;padding:10px 38px 10px 14px;border:1.5px solid var(--accent);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;max-width:100%}
select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.retour{font:.9rem system-ui,Arial,sans-serif;display:inline-block;padding:9px 14px;border:1.5px solid var(--accent);border-radius:8px;color:var(--accent);text-decoration:none;white-space:nowrap}
.retour:hover{background:var(--accent);color:var(--accent-ink)}
.titre{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.open{font:.9rem system-ui,Arial,sans-serif;color:var(--accent);text-decoration:underline}
main{flex:1;min-height:0;padding:0}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.accueil{max-width:640px;margin:0 auto;padding:48px 20px;font-family:system-ui,Arial,sans-serif}
.accueil p{color:var(--muted)}
.accueil ul{padding:0;list-style:none;display:grid;gap:10px}
.accueil a{display:block;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);color:var(--ink);text-decoration:none;border-radius:6px}
.accueil a:hover{border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="titre">
    <a class="retour" href="https://simphysique.tn">← Retour à SimPhysique</a>
    <h1>Les réactions acide-base</h1>
  </div>
  <div class="menu">
    <label for="nav">Choisir une activité</label>
    <select id="nav">
      <option value="">Accueil</option>
      <option value="acide_base.html">Force des acides et des bases</option>
      <option value="pH_cc_acide.html">TP : pH et concentration d’un acide</option>
      <option value="pH_cc_base.html">TP : pH et concentration d’une base</option>
      <option value="acide_par_base.html">Dosage d’un monoacide par la soude</option>
      <option value="base_par_acide.html">Dosage d’une monobase par HCl</option>
    </select>
    <a id="open" class="open" target="_blank" rel="noopener" hidden>Ouvrir seul</a>
  </div>
</header>
<main id="main"></main>
<template id="home">
  <div class="accueil">
    <p>Choisissez une activité dans le menu déroulant ou ci-dessous.</p>
    <ul id="list"></ul>
  </div>
</template>
<script>
const sel=document.getElementById('nav'),main=document.getElementById('main'),open_=document.getElementById('open');
function show(v){
  if(sel.value!==v) sel.value=v;
  main.innerHTML='';
  if(!v){
    main.appendChild(document.getElementById('home').content.cloneNode(true));
    const ul=main.querySelector('#list');
    [...sel.options].slice(1).forEach(o=>{const li=document.createElement('li'),a=document.createElement('a');a.href='#'+o.value;a.textContent=o.textContent;li.appendChild(a);ul.appendChild(li)});
    open_.hidden=true;main.style.overflow='auto';
  }else{
    const f=document.createElement('iframe');f.src=v;f.title=sel.selectedOptions[0].textContent;main.appendChild(f);
    open_.href=v;open_.hidden=false;main.style.overflow='hidden';
  }
}
sel.addEventListener('change',()=>{location.hash=sel.value});
function route(){const h=decodeURIComponent(location.hash.slice(1));show([...sel.options].some(o=>o.value===h)?h:'')}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
