<script>
/* Simulation « pile Daniell » – conversion HTML/JS de pile_cc.swf (ActionScript 2) */
(() => {
const $stage = document.getElementById('stage'), W = 900, H = 600;
const FR = [1, 2, 3, 4, 5, 6];                      // index du menu -> image de la timeline
const PILES = [null,                                 // [pile, E0]
  {pile: 1, E0: 1.1}, {pile: 2, E0: -0.47}, {pile: 2, E0: -0.35}, {pile: 1, E0: 0.64}, {pile: 1, E0: 0.31}];

// ---- état (mêmes noms que dans le code ActionScript) ----
let frame = 1, pile = 1, E0, volts, calibre = 0, signe = '', valeur = '', msgErr = '', msgBr = '';

const el = (t, p = {}, parent = $stage) => Object.assign(parent.appendChild(document.createElement(t)), p);

// ---- fabrication / placement des clips ----
function place(e, x, y) { e._x = x; e._y = y; e.style.left = (x - e._ox) + 'px'; e.style.top = (y - e._oy) + 'px'; }
function setFrame(e, i) {
  const f = e._A.f[i]; e._ox = f.ox; e._oy = f.oy;
  if (f.src) e.src = f.src;
  e.style.width = f.w + 'px'; e.style.height = f.h + 'px'; e.style.transformOrigin = f.ox + 'px ' + f.oy + 'px';

}
function mk(it) {
  const A = ASSETS[it.ch]; if (!A) return null; let e;
  if (A.inl) {                                       // SVG en ligne (éléments interactifs) – ids préfixés
    const p = 'u' + (++uid) + '_', ids = [...A.f[0].svg.matchAll(/ id="([^"]+)"/g)].map(m => m[1]);
    let s = A.f[0].svg;
    ids.forEach(i => { s = s.split(' id="' + i + '"').join(' id="' + p + i + '"').split('#' + i + '"').join('#' + p + i + '"').split('(#' + i + ')').join('(#' + p + i + ')'); });
    const d = document.createElement('div'); d.innerHTML = s.trim(); e = $stage.appendChild(d.firstElementChild);

// ---- coordonnées souris -> scène ----
function pt(ev) { const r = $stage.getBoundingClientRect(), k = r.width / W; return {x: (ev.clientX - r.left) / k, y: (ev.clientY - r.top) / k}; }

const kScale = () => $stage.getBoundingClientRect().width / W;

$stage.addEventListener('contextmenu', ev => ev.preventDefault());
$stage.addEventListener('pointerdown', ev => {                          // doigt près d'une pièce mobile : on la saisit
  if (ev.pointerType !== 'touch') return;
  const t = ev.target, live = DR.filter(d => d.isConnected);

function setValeur() {

    case -2: valeur = signe + '01.1'; msgErr = 'ATTENTION, MAUVAIS CHOIX DU CALIBRE'; return;
    case -3: valeur = signe + volts.toFixed(2); return;
    case -4: valeur = signe + volts.toFixed(3); return;
    default: valeur = '000'; msgErr = 'ATTENTION ON MESURE UNE TENSION CONTINUE';
  }
}
function verif() {
  msgBr = ''; msgErr = '';
  if (calibre !== 0) {
    if (!branchement) {
      valeur = '000';
      if (!eR || !eB) msgBr += "LE VOLTMETRE N'EST PAS BRANCHE\n";
      if (!eG) msgBr += "LA LAME DE GAUCHE N'EST PAS EN PLACE\n";
      if (!eD) msgBr += "LA LAME DE DROITE N'EST PAS EN PLACE\n";
      if (!eP) msgBr += "LE PONT SALIN N'EST PAS EN PLACE\n";
      show(); return false;
    }

    if (eR === 1 && eB === 2 && pile === 2) signe = '-';

}

}
function wires() {
  const q = (a, c, p) => `M${a._x} ${a._y} Q${c._x} ${c._y} ${p._x} ${p._y}`;
  $wR.setAttribute('d', q(O.ficheR2, O.ancre2, O.ficheR)); $wB.setAttribute('d', q(O.ficheB2, O.ancre, O.ficheB));
}
function refresh() { follow(); wires(); }

function alerte() {                                  // animation « choisir d'abord une pile »
  const a = O.alerte; if (!a || alertTimer) return; let i = 0; const seq = a._A.seq || [0];

// ---- construction d'une image (« gotoAndStop ») ----
function build(f) {

  });

  $msg = el('div', {id: 'msg'}); $lcd = el('div', {id: 'lcd'});
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.id = 'wires'; svg.setAttribute('width', W); svg.setAttribute('height', H);

  $cbG.disabled = $cbD.disabled = (f === 1);

  initVoltmeter(); initParts(); conc(true); verif(); refresh();
}

// teinte des solutions selon la concentration (Cu²⁺ / Fe²⁺ : 4 nuances)
function conc(init) {
  if (!init) recompute();
  const idx = v => CONC.findIndex(c => c[0] === v);
  Object.values(O).forEach(e => { if (e._ch === 278 || e._ch === 291) setFrame(e, Math.max(0, idx(e._x0 < 150 ? CG : CD))); });
  if (!init) verif();                                // une solution à gauche suit cb_G, à droite cb_D
}

// ---- multimètre : bouton rotatif ----
function initVoltmeter() {
  const v = O.voltmeter, rotor = part(v, 'rotor'); if (!rotor) return;
  const m0 = rotor.getAttribute('transform'), mm = m0.match(/matrix\(([^)]+)\)/)[1].split(',').map(Number);
  const sx = v._m[0], sy = v._m[3], c = {x: v._x + mm[4] * sx, y: v._y + mm[5] * sy};
  const rot = d => rotor.setAttribute('transform', m0 + ' rotate(' + d + ')'); rot(0);
  const knob = el('div', {id: 'knob'}); knob.style.cssText += `left:${c.x - 38}px;top:${c.y - 38}px;width:76px;height:76px`;
  let on = false;
  const turn = ev => {
    const p = pt(ev), lx = (p.x - v._x) / sx, ly = (p.y - v._y) / sy;            // _xmouse / _ymouse du clip
    const a = Math.atan2(lx, -ly) / (Math.PI / 180);
    calibre = Math.round(a / 22.5); rot(22.5 * calibre);
    if (calibre !== 0) { if (verif()) { msgErr = ''; setValeur(); show(); } else valeur = '000'; }
    else { valeur = ''; msgErr = ''; verif(); }
    show();
  };
  knob.onpointerdown = ev => { on = true; knob.setPointerCapture(ev.pointerId); turn(ev); };
  knob.onpointermove = ev => { if (on) turn(ev); };
  knob.onpointerup = knob.onpointercancel = () => on = false;
  O._rot = rot;
}

// ---- pont salin, lames, fiches ----
function initParts() {
  const {pont, G, D, ficheR, ficheB} = O, tip = part(pont, 'pt_el'), ban = e => part(e, 'banane');
  tip && (tip.style.display = 'none');
  if (frame === 1) {                                 // pas de pile choisie : on ne peut que faire clignoter l'alerte
    [pont, ...Object.values(O).filter(e => [237, 241, 245, 250].includes(e._ch))].forEach(e => { e.style.pointerEvents = 'visiblePainted'; e.addEventListener('pointerdown', alerte); });
    const b = O.bt, h = ASSETS[273].f[2], d = el('div', {className: 'hit'});
    d.style.cssText = `left:${b._x - h.ox}px;top:${b._y - h.oy}px;width:${h.w}px;height:${h.h}px`; d.onpointerdown = alerte;
    if (b) b.style.display = 'none';
    // le $wR/$wB restent actifs : les fiches se déplacent librement
  } else {
    drag(pont, {down() { tip && (tip.style.display = 'none'); eP = 0; branchement = false; },
      up() { const x = pont._x, y = pont._y;
        const ex = tol(10) - 10;
        if (x >= 133 - ex && x <= 153 + ex && y >= 350 - ex && y <= 420 + ex) { place(pont, 140, 420); eP = 1; branchement = connected(); }
        else { place(pont, pont._x0, pont._y0); eP = 0; }
        tip && (tip.style.display = 'none'); verif(); }});
    pont.addEventListener('pointerenter', () => tip && (tip.style.display = ''));
    pont.addEventListener('pointerleave', () => tip && (tip.style.display = 'none'));
    const elec = (e, b, dx, key) => drag(e, {lock: true, down() { set(key, 0); branchement = false; },
      up() { const bb = O[b];
        if (bb._x <= e._x && e._x <= bb._x + 80 && bb._y - 50 <= e._y && e._y <= bb._y + 50) { place(e, bb._x + dx, bb._y + 50); set(key, 1); branchement = connected(); }
        else { place(e, e._x0, e._y0); set(key, 0); }
        verif(); }});
    const set = (k, v) => { if (k === 'G') eG = v; else eD = v; };
    elec(G, 'becher_G', 20, 'G'); elec(D, 'becher_D', 60, 'D');
  }
  // fiches du multimètre (rouge = ficheR, noire/bleue = ficheB)
  const plug = (e, other, dxD, dxG, yHi, isR) => drag(e, {
    down() { isR ? eR = 0 : eB = 0; branchement = false; const b = ban(e); b && (b.style.display = ''); },
    up() {
      const x = e._x, y = e._y, other_ = isR ? eB : eR, T = tol(10);
      const tD = O.D && other_ !== 1 && Math.abs(x - (O.D._x + dxD)) <= T && y >= O.D._y - 100 - 30 - T && y <= O.D._y - 100 + yHi + T - 10;
      const tG = O.G && other_ !== 2 && Math.abs(x - (O.G._x + dxG)) <= T && y >= O.G._y - 100 - 30 - T && y <= O.G._y - 100 + yHi + T - 10;
      const b = ban(e);
      if (tD) { place(e, O.D._x + dxD, O.D._y - 100); isR ? eR = 1 : eB = 1; b && (b.style.display = 'none'); }
      else if (tG) { place(e, O.G._x + dxG, O.G._y - 100); isR ? eR = 2 : eB = 2; b && (b.style.display = 'none'); }
      else isR ? eR = 0 : eB = 0;
      branchement = connected(); verif();
    }});
  plug(ficheR, ficheB, -3, -3, 20, true); plug(ficheB, ficheR, 8, 7, 10, false);
}

function loadPile(i) {
  const P = PILES[i]; if (P) { pile = P.pile; E0 = P.E0; volts = Math.abs(P.E0); } else { E0 = undefined; volts = NaN; }
  pileIdx = i; rows = []; posSide = null; traced = ner = false; renderLab();
  calibre = 0; signe = ''; valeur = ''; msgErr = msgBr = ''; branchement = false; eP = eG = eD = eR = eB = 0; CG = CD = 1;
  build(FR[i]);
}


// ---- partie 1 : équation, polarité, tableau ; partie 2 : exploitation ; partie 3 : loi de Nernst ----
const METALS = [null, ['Zn', 'Cu'], ['Cu', 'Pb'], ['Fe', 'Zn'], ['Zn', 'Pb'], ['Fe', 'Pb']];   // [bécher gauche, bécher droit]
let rows = [], pileIdx = 0, traced = false, ner = false;
const fr = (x, d) => (d === undefined ? String(x) : x.toFixed(d)).replace('.', ',').replace('-', '−');
const lab = document.createElement('section'); lab.id = 'lab'; document.body.appendChild(lab);
lab.innerHTML = `<h2 id="labT"></h2><div id="pol"></div>
<div class="bar"><button id="bAdd">Noter la mesure</button><button id="bDel">Supprimer la dernière</button><button id="bClr">Tout effacer</button><span id="bNote"></span></div>
<div class="tw"><table><thead><tr><th>N°</th><th id="hG"></th><th id="hD"></th><th id="hP"></th><th>log π</th><th id="hE"></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="part"><h2>2. Exploitation</h2>
  <div class="bar"><button id="bPlot">Tracer la courbe E = f(log π)</button><button id="bSave" style="display:none">Enregistrer la courbe</button><button id="bPrint" style="display:none">Imprimer</button><span id="pNote"></span></div>
  <svg id="plot" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif"></svg><div id="fit" class="eq"></div></div>
<div class="part"><h2>3. Généralisation : loi de Nernst</h2>
  <div class="bar"><button id="bNer">Établir la formule de Nernst</button><span id="nNote"></span></div><div id="ner" class="eq"></div></div>`;
const $l = id => lab.querySelector('#' + id), note = t => $l('bNote').textContent = t || '';
const der = () => rows.map(r => ({l: r.CG, d: r.CD, pi: parseFloat((r.CG / r.CD).toPrecision(6)), lg: Math.round(Math.log10(r.CG / r.CD) * 1000) / 1000, E: r.E}));
$l('bAdd').onclick = () => {
  note();
  if (!pileIdx) return note("Choisissez d'abord une pile.");
  if (calibre === 0) return note('Tournez le bouton du voltmètre sur un calibre V⎓.');
  if (!verif()) return note(branchement ? '' : 'Mesure impossible : lames, pont salin et fiches doivent être en place.');
  if (calibre !== -3 && calibre !== -4) return note('Choisissez le calibre adéquat (20 ou 2) pour lire E.');
  const r = {CG, CD, E: parseFloat(valeur) * (eR === 1 ? 1 : -1)}, k = rows.findIndex(x => x.CG === CG && x.CD === CD);   // fiche rouge à droite : E = U ; à gauche : E = −U
  k >= 0 ? rows[k] = r : rows.push(r); renderLab();
};
$l('bDel').onclick = () => { rows.pop(); note(); renderLab(); };
$l('bClr').onclick = () => { rows = []; note(); renderLab(); };
$l('bPlot').onclick = () => { if (!fitLine()) return $l('pNote').textContent = 'Notez au moins deux mesures avec des valeurs de log π différentes.'; $l('pNote').textContent = ''; traced = true; renderLab(); };
$l('bNer').onclick = () => { if (!traced) return $l('nNote').textContent = "Tracez d'abord la courbe (partie 2)."; $l('nNote').textContent = ''; ner = true; renderLab(); };

function renderLab() {
  const m = METALS[pileIdx], g = m ? m[0] : '', d = m ? m[1] : '', s2 = m ? `${g}²⁺` : 'ion gauche', p2 = m ? `${d}²⁺` : 'ion droite';
  $l('labT').textContent = '1. Équation, polarité et tableau de mesures' + (pileIdx ? ' – pile ' + LABELS[pileIdx] : '');
  const eq = m ? `<b>Symbole de la pile :</b> ${g} | ${g}²⁺ ‖ ${d}²⁺ | ${d}<br>
       <b>Équation associée à la pile :</b> ${g} + ${d}²⁺ ⇄ ${g}²⁺ + ${d}<br>
       <b>Fonction des concentrations :</b> π = [${g}²⁺] / [${d}²⁺] &nbsp;<small>(ion gauche / ion droite)</small>` : '';
  $l('pol').innerHTML = !pileIdx ? '<p class="hint">Choisissez une pile dans le menu de la simulation.</p>'
    : `<div class="eq">${eq}<br><b>Polarité de la pile :</b> ` + (!posSide
      ? `à identifier avec le voltmètre : branchez-le (fiche rouge sur V/Ω, fiche noire sur COM), choisissez un calibre en volts continus et lisez le signe de U = V(V/Ω) − V(COM) ; si U &gt; 0, la lame reliée à la borne V/Ω est le pôle +.`
      : `pôle + = lame de ${posSide === 'D' ? 'droite (' + d + ')' : 'gauche (' + g + ')'}, pôle − = lame de ${posSide === 'D' ? 'gauche (' + g + ')' : 'droite (' + d + ')'}.<br>
         On mesure <b>E = V<sub>bD</sub> − V<sub>bG</sub></b> (E ${posSide === 'D' ? '&gt;' : '&lt;'} 0 ici).`) + '</div>';
  $l('hG').textContent = `[${s2}] (mol/L)`; $l('hD').textContent = `[${p2}] (mol/L)`;
  $l('hP').textContent = m ? `π = [${s2}]/[${p2}]` : 'π'; $l('hE').innerHTML = 'E = V<sub>bD</sub> − V<sub>bG</sub> (V)';
  $l('tb').innerHTML = der().map((r, i) => `<tr><td>${i + 1}</td><td>${fr(r.l)}</td><td>${fr(r.d)}</td><td>${fr(r.pi)}</td><td>${fr(r.lg)}</td><td class="e">${fr(r.E, 3)}</td></tr>`).join('')
    || '<tr><td colspan="6" style="color:#888">Aucune mesure pour le moment</td></tr>';
  if (traced && !fitLine()) traced = false, ner = false;
  exploit();
}
function fitLine() {                                   // régression linéaire E = c + s·log π
  const dr = der(), n = dr.length, sx = dr.reduce((a, r) => a + r.lg, 0), sy = dr.reduce((a, r) => a + r.E, 0),
        sxx = dr.reduce((a, r) => a + r.lg * r.lg, 0), sxy = dr.reduce((a, r) => a + r.lg * r.E, 0), den = n * sxx - sx * sx;
  if (n < 2 || Math.abs(den) < 1e-9) return null; const s = (n * sxy - sx * sy) / den; return {s, c: (sy - s * sx) / n};
}
function exploit() {
  const f = traced ? fitLine() : null, svg = $l('plot'), fe = $l('fit'), ne = $l('ner');
  svg.style.display = fe.style.display = f ? 'block' : 'none'; ne.style.display = (f && ner) ? 'block' : 'none';
  $l('bSave').style.display = $l('bPrint').style.display = f ? '' : 'none'; PS = null;
  if (!f) return;
  const dr = der(), L = 70, R = 620, T = 20, B = 310, x0 = -3, x1 = 3, ys = dr.map(r => r.E).concat([f.c + f.s * x0, f.c + f.s * x1]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo || 0.2) * 0.2; lo -= pad; hi += pad;
  const step = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5].find(s => (hi - lo) / s <= 7) || 1;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const X = v => L + (v - x0) / (x1 - x0) * (R - L), Y = v => B - (v - lo) / (hi - lo) * (B - T), yA = f.c + f.s * x0, yB = f.c + f.s * x1;
  let s = `<rect x="${L}" y="${T}" width="${R - L}" height="${B - T}" fill="#fcfcff" stroke="#889"/>`;
  for (let v = x0; v <= x1; v++) s += `<line x1="${X(v)}" y1="${T}" x2="${X(v)}" y2="${B}" stroke="#dde"/><text x="${X(v)}" y="${B + 16}" font-size="12" text-anchor="middle">${fr(v)}</text>`;
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line x1="${L}" y1="${Y(v)}" x2="${R}" y2="${Y(v)}" stroke="#dde"/><text x="${L - 6}" y="${Y(v) + 4}" font-size="12" text-anchor="end">${fr(v, step < 0.05 ? 2 : 1)}</text>`;
  if (lo < 0 && hi > 0) s += `<line x1="${L}" y1="${Y(0)}" x2="${R}" y2="${Y(0)}" stroke="#667"/>`;
  s += `<line x1="${X(0)}" y1="${T}" x2="${X(0)}" y2="${B}" stroke="#667"/><text x="${(L + R) / 2}" y="${B + 36}" font-size="13" text-anchor="middle">log π</text>
        <text transform="translate(16 ${(T + B) / 2}) rotate(-90)" font-size="13" text-anchor="middle">E = V_bD − V_bG (V)</text>
        <line x1="${X(x0)}" y1="${Y(yA)}" x2="${X(x1)}" y2="${Y(yB)}" stroke="#d33" stroke-width="2"/>`;
  dr.forEach(r => s += `<circle cx="${X(r.lg)}" cy="${Y(r.E)}" r="5" fill="#2a2a9a" stroke="#fff"/>`);
  [['A', x0, yA], ['B', x1, yB]].forEach(([t, x, y]) => s += `<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="none" stroke="#d33" stroke-width="2"/><text x="${X(x) + (x < 0 ? 8 : -16)}" y="${Y(y) - 8}" font-size="13" fill="#d33" font-weight="bold">${t}</text>`);
  svg.innerHTML = s; PS = {L, R, T, B, x0, x1, lo, hi, X, Y};
  const sg = f.s < 0 ? '−' : '+';
  fe.innerHTML = `<b>Détermination de la pente :</b> on lit deux points de la droite, A (log π = −3 ; E = ${fr(yA, 3)} V) et B (log π = 3 ; E = ${fr(yB, 3)} V).<br>
    a = ΔE / Δ(log π) = (${fr(yB, 3)} − (${fr(yA, 3)})) / (3 − (−3)) = <b>${fr(f.s, 3)} V</b><br>
    <b>Équation de la droite :</b> E = a · log π + b, avec b = ${fr(f.c, 3)} V (valeur de E pour log π = 0), soit
    <b>E = ${fr(f.c, 3)} ${sg} ${fr(Math.abs(f.s), 3)} · log π</b>`;
  ne.innerHTML = `<b>Résultat expérimental :</b> E = ${fr(f.c, 3)} ${sg} ${fr(Math.abs(f.s), 3)} · log π ; la pente est a ≈ ${fr(f.s, 3)} V.<br>
    <b>Rôle de n :</b> l'équation associée ${m2()} échange <b>n = 2 électrons</b> et la pente vaut −0,06 / n = −0,06 / 2 = −0,03 V.<br>
    <b>Généralisation :</b> pour une pile dont l'équation associée échange n électrons (à 25 °C),<br>
    <div class="formula">E = E° − (0,06 / n) · log π</div>
    où E° est la f.é.m. standard de la pile, valeur de E pour π = 1 (ici E° ≈ ${fr(f.c, 3)} V).<br>
    <small>Pente selon n : n = 1 → −0,06 V ; n = 2 → −0,03 V ; n = 3 → −0,02 V.</small>`;
}
// ---- enregistrer / imprimer / infobulle ----
let PS = null;
$l('bPrint').onclick = () => window.print();
$l('bSave').onclick = () => {
  const svg = $l('plot'), inner = new XMLSerializer().serializeToString(svg).replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, ''),
    title = 'Courbe E = f(log π) – pile ' + LABELS[pileIdx],
    xml = `<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 -44 640 400" font-family="Arial,sans-serif"><rect x="0" y="-44" width="640" height="400" fill="#fff"/><text x="320" y="-18" font-size="16" font-weight="bold" text-anchor="middle">${title}</text>${inner}</svg>`,
    img = new Image();
  img.onload = () => {
    const c = Object.assign(document.createElement('canvas'), {width: 1280, height: 800}); c.getContext('2d').drawImage(img, 0, 0);
    c.toBlob(b => { const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(b), download: 'courbe_E_log_pi.png'}); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
};
const tip = Object.assign(document.createElement('div'), {id: 'tip'}); document.body.appendChild(tip);
const plotEl = $l('plot'); plotEl.style.cursor = 'crosshair';
plotEl.addEventListener('pointermove', ev => {
  const ctm = PS && plotEl.getScreenCTM && plotEl.getScreenCTM(); if (!ctm) return;
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(ctm.inverse());
  if (p.x < PS.L || p.x > PS.R || p.y < PS.T || p.y > PS.B) { tip.style.display = 'none'; return; }
  let txt = `log π = ${fr(PS.x0 + (p.x - PS.L) / (PS.R - PS.L) * (PS.x1 - PS.x0), 2)}<br>E = ${fr(PS.lo + (PS.B - p.y) / (PS.B - PS.T) * (PS.hi - PS.lo), 3)} V`;
  const near = der().map((r, i) => ({r, i, d: Math.hypot(PS.X(r.lg) - p.x, PS.Y(r.E) - p.y)})).sort((a, b) => a.d - b.d)[0];
  if (near && near.d < 12) txt = `<b>Mesure n° ${near.i + 1}</b><br>log π = ${fr(near.r.lg)}<br>E = ${fr(near.r.E, 3)} V`;
  tip.innerHTML = txt; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = (ev.clientX + 16 + w > innerWidth ? ev.clientX - w - 12 : ev.clientX + 16) + 'px';
  tip.style.top = (ev.clientY + 16 + h > innerHeight ? ev.clientY - h - 12 : ev.clientY + 16) + 'px';
});
plotEl.addEventListener('pointerleave', () => tip.style.display = 'none');

const m2 = () => { const m = METALS[pileIdx]; return m ? `${m[0]} + ${m[1]}²⁺ ⇄ ${m[0]}²⁺ + ${m[1]}` : ''; };

let $msg, $lcd, $wR, $wB, $cbP, $cbG, $cbD;
function fit() { const w = document.getElementById('view'), k = w.clientWidth / W;   // la largeur vient du CSS, identique à celle du tableau
  $stage.style.transform = `scale(${k})`; w.style.height = H * k + 'px'; }
addEventListener('resize', fit); window.ResizeObserver && new ResizeObserver(fit).observe(document.getElementById('view')); fit(); loadPile(0);
})();
</script>
